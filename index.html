<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜比之家</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🏡 歡迎來到菜比之家！</h1>

    <p>歡迎來到菜菜與比比共同打造的創作小天地。</p>


    <div class="game-area">

        <!-- 菜比之家 -->
        <img
            id="house"
            class="house"
            src="images/caibi-house.png"
            alt="菜比之家"
        >


        <!-- 場景入口 -->
        <a
            href="livingroom.html"
            class="door-area"
            aria-label="進入客廳">
        </a>

        <a
            href="farm.html"
            class="farm-area"
            aria-label="進入農場">
        </a>

        <a
            href="bakery.html"
            class="bakery-area"
            aria-label="進入烘焙坊">
        </a>

        <a
            href="announcement.html"
            class="mailbox-area"
            aria-label="查看公告欄">
        </a>


        <!-- 小菜雞 -->
        <img
            id="chicken"
            class="npc chicken"
            src="images/chicken.png"
            alt="小菜雞"
        >

        <div
            id="chicken-dialogue"
            class="npc-dialogue chicken-dialogue">
            啾啾～
        </div>


        <!-- 小比乾 -->
        <img
            id="cat"
            class="npc cat"
            src="images/cat.png"
            alt="小比乾"
        >

        <div
            id="cat-dialogue"
            class="npc-dialogue cat-dialogue">
            喵～
        </div>

        <!-- 兩隻互動愛心 -->
        <div id="love-heart" class="love-heart">
            ❤️
        </div>

        <div id="meet-dialogue" class="meet-dialogue">

        </div>
    </div>


    <script src="script.js"></script>

</body>

</html>
